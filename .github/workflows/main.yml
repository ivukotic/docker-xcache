name: Build ATLAS xcache image

on:
  push:
    branches:
      - "testing-upgrade"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Build & Push XCACHE image
        uses: docker/build-push-action@v7
        with:
          context: atlas-xcache/.
          file: atlas-xcache/Dockerfile
          push: true
          tags: |
            ivukotic/atlas-xcache:05.26
            ivukotic/atlas-xcache:${{ github.sha }}

      - name: Docker Build & Push HEARTBEATS image
        uses: docker/build-push-action@v7
        with:
          context: atlas-xcache/.
          file: atlas-xcache/Dockerfile.heartbeats
          push: true
          tags: |
            ivukotic/atlas-xcache-heartbeats:05.26
            ivukotic/atlas-xcache-heartbeats:${{ github.sha }}

      - name: Show XRDCP version
        run: |
          docker run --rm ivukotic/atlas-xcache:05.26 xrdcp -version

      - name: Show Rucio client version
        run: |
          docker run --rm ivukotic/atlas-xcache-heartbeats:05.26 rucio --version
